<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="30" y="35" font-size="18" font-weight="bold" fill="#1e293b">Precision@50 &amp; Precision@20 on Unseen Client Holdout</text>
  <text x="30" y="55" font-size="12" fill="#64748b">Comparison across models and baseline rule on 4,511 test content items (Base Rate = 32.4%)</text>

  <line x1="120" y1="80" x2="600" y2="80" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="125" x2="600" y2="125" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="170" x2="600" y2="170" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="215" x2="600" y2="215" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="260" x2="600" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Y axis -->
  <text x="105" y="84" font-size="11" fill="#94a3b8" text-anchor="end">1.00</text>
  <text x="105" y="129" font-size="11" fill="#94a3b8" text-anchor="end">0.75</text>
  <text x="105" y="174" font-size="11" fill="#94a3b8" text-anchor="end">0.50</text>
  <text x="105" y="219" font-size="11" fill="#94a3b8" text-anchor="end">0.25</text>
  <text x="105" y="264" font-size="11" fill="#94a3b8" text-anchor="end">0.00</text>

  <!-- Base rate dashed line at y=201.7 (32.4%) -->
  <line x1="120" y1="202" x2="600" y2="202" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="595" y="196" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">Base Rate: 0.324</text>

  <!-- Random Forest: P@50=0.74 (h=133.2, y=126.8), P@20=0.80 (h=144, y=116) -->
  <rect x="155" y="127" width="30" height="133" rx="3" fill="#059669"/>
  <rect x="189" y="116" width="30" height="144" rx="3" fill="#34d399"/>
  <text x="187" y="278" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Random Forest</text>
  <text x="170" y="121" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">0.740</text>
  <text x="204" y="110" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">0.800</text>

  <!-- Decision Tree: P@50=0.58 (h=104.4, y=155.6), P@20=0.65 (h=117, y=143) -->
  <rect x="270" y="156" width="30" height="104" rx="3" fill="#0284c7"/>
  <rect x="304" y="143" width="30" height="117" rx="3" fill="#38bdf8"/>
  <text x="302" y="278" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Decision Tree</text>
  <text x="285" y="150" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">0.580</text>
  <text x="319" y="137" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">0.650</text>

  <!-- Logistic Regression: P@50=0.52 (h=93.6, y=166.4), P@20=0.55 (h=99, y=161) -->
  <rect x="385" y="166" width="30" height="94" rx="3" fill="#6366f1"/>
  <rect x="419" y="161" width="30" height="99" rx="3" fill="#818cf8"/>
  <text x="417" y="278" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Logistic Reg</text>
  <text x="400" y="160" font-size="10" font-weight="bold" fill="#6366f1" text-anchor="middle">0.520</text>
  <text x="434" y="155" font-size="10" font-weight="bold" fill="#6366f1" text-anchor="middle">0.550</text>

  <!-- Baseline Rule: P@50=0.38 (h=68.4, y=191.6), P@20=0.45 (h=81, y=179) -->
  <rect x="500" y="192" width="30" height="68" rx="3" fill="#eab308"/>
  <rect x="534" y="179" width="30" height="81" rx="3" fill="#fde047"/>
  <text x="532" y="278" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Baseline Rule</text>
  <text x="515" y="186" font-size="10" font-weight="bold" fill="#ca8a04" text-anchor="middle">0.380</text>
  <text x="549" y="173" font-size="10" font-weight="bold" fill="#ca8a04" text-anchor="middle">0.450</text>

  <!-- Legend -->
  <rect x="420" y="38" width="12" height="12" rx="2" fill="#059669"/>
  <text x="438" y="48" font-size="11" fill="#475569">Precision@50</text>
  <rect x="525" y="38" width="12" height="12" rx="2" fill="#34d399"/>
  <text x="543" y="48" font-size="11" fill="#475569">Precision@20</text>
</svg>